<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tableau de bord — Interventions</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="../nav.css" />
<script>window.CURRENT_VIEW = 'dashboard';</script>
<script src="../nav.js"></script>
</head>
<body>
  <div class="app">
    <div class="header-row">
      <div class="badge">Tableau de bord — Interventions</div>
      <button id="btn-settings" class="btn-gear" type="button" title="Choisir les champs affichés dans les graphiques">⚙</button>
    </div>
    <div class="version-tag" id="version-tag"></div>

    <div id="state-screen" class="state-screen">
      <div class="spinner"></div>
      Chargement des données…
    </div>

    <div id="dashboard" class="dashboard" hidden>
      <div class="filters" id="filters">
        <div class="filter-field">
          <label for="filter-site">Site</label>
          <select id="filter-site">
            <option value="">Tous les sites</option>
          </select>
        </div>
        <div class="filter-field">
          <label for="filter-service">Service</label>
          <select id="filter-service">
            <option value="">Tous les services</option>
          </select>
        </div>
        <button id="filter-reset" class="btn-reset" type="button">Réinitialiser</button>
        <button id="btn-refresh" class="btn-reset" type="button">↻ Rafraîchir</button>
        <div class="filter-count" id="filter-count"></div>
      </div>

      <div class="form-tabs" id="form-tabs">
        <!-- Peuplé dynamiquement : "Tous" + un bouton par formulaire actif -->
      </div>

      <div class="chart-grid" id="charts-general">
        <div class="chart-card">
          <h2>Répartition par formulaire</h2>
          <div class="chart-wrap"><canvas id="chart-formulaire"></canvas></div>
          <div class="chart-empty" id="empty-formulaire" hidden>Aucune donnée pour cette sélection</div>
        </div>
        <div class="chart-card">
          <h2>Répartition par site</h2>
          <div class="chart-wrap"><canvas id="chart-site"></canvas></div>
          <div class="chart-empty" id="empty-site" hidden>Aucune donnée pour cette sélection</div>
        </div>
        <div class="chart-card">
          <h2>Répartition par service</h2>
          <div class="chart-wrap"><canvas id="chart-service"></canvas></div>
          <div class="chart-empty" id="empty-service" hidden>Aucune donnée pour cette sélection</div>
        </div>
      </div>

      <div class="chart-grid" id="charts-formulaire" hidden>
        <!-- Peuplé dynamiquement selon le formulaire sélectionné -->
      </div>
    </div>
  </div>

  <!-- Panneau de réglages : choisir les champs affichés dans les
       graphiques par formulaire. Ouvert par le bouton ⚙ du bandeau. -->
  <div class="modal-overlay" id="settings-overlay" hidden>
    <div class="modal-box">
      <div class="modal-toolbar">
        <h2 style="margin:0;font-size:1.1rem;">Champs affichés dans les graphiques</h2>
        <button id="settings-close" class="btn-close" type="button" aria-label="Fermer">✕</button>
      </div>
      <div class="settings-body" id="settings-body">
        <div class="state-screen" style="padding:24px 0;"><div class="spinner"></div>Chargement des champs…</div>
      </div>
      <div class="settings-footer">
        <button id="settings-save" class="btn-download" type="button">Enregistrer</button>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="charts.js"></script>
  <script src="app.js"></script>
</body>
</html>
