<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Consultation des interventions</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="badge">Consultation des interventions</div>
    <div class="version-tag" id="version-tag"></div>

    <div id="state-screen" class="state-screen">
      <div class="spinner"></div>
      Chargement des données…
    </div>

    <div id="main" class="main" hidden>
      <div class="list-pane">
        <div class="list-header">
          <span id="list-count"></span>
          <button id="btn-refresh" class="btn-reset" type="button">↻ Rafraîchir</button>
        </div>
        <div class="list" id="list"></div>
      </div>

      <div class="detail-pane" id="detail-pane">
        <div class="detail-empty" id="detail-empty">
          Sélectionnez une réponse dans la liste pour en voir le détail.
        </div>
        <div class="detail-content" id="detail-content" hidden></div>
      </div>
    </div>
  </div>

  <!-- Fenêtre modale pour agrandir une pièce jointe, sans quitter la page -->
  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal-box">
      <div class="modal-toolbar">
        <a id="modal-download" class="btn-download" href="#" download>⬇ Télécharger</a>
        <button id="modal-close" class="btn-close" type="button" aria-label="Fermer">✕</button>
      </div>
      <img id="modal-image" src="" alt="Pièce jointe agrandie" />
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
